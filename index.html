<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>שינון סדר דין פלילי</title>
<meta name="description" content="שינון סעיפי החוק לקורס סדר דין פלילי: נוסח מדויק, כרטיסיות, השלמת חסר ומבחני דמה.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="סד״פ">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1217" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap">
<style>
/* Layout: one narrow column like a pocket statute book; sticky header, fixed bottom tabs, law text set in the Frank Ruehl face the official text uses. */
:root{
  --paper:#F3F4F7; --surface:#FFFFFF; --sunk:#E9ECF1; --ink:#161D29; --muted:#5B6577; --line:#D9DEE6;
  --accent:#8A1C35; --accent-ink:#FFFFFF; --accent-soft:#F3E3E7;
  --t-fg:#1C4A86; --t-bg:#E2EBF8; --a-fg:#0E5F52; --a-bg:#DCF0EB; --o-fg:#7A4E00; --o-bg:#F8EBCF;
  --ok:#1D7243; --ok-bg:#E1F2E7; --bad:#AE2A21; --bad-bg:#F9E3E1;
  --law:"Frank Ruhl Libre","FrankRuehl","David","Times New Roman",serif;
  --ui:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1217; --surface:#181C24; --sunk:#12161C; --ink:#E7EAF0; --muted:#9BA4B4; --line:#2A313C;
  --accent:#E57C95; --accent-ink:#1A0B10; --accent-soft:#3A1E27;
  --t-fg:#A3C4F3; --t-bg:#1A2A41; --a-fg:#86D6C4; --a-bg:#13302A; --o-fg:#EDC678; --o-bg:#372B12;
  --ok:#62C98E; --ok-bg:#16301F; --bad:#F28A80; --bad-bg:#3B1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1217; --surface:#181C24; --sunk:#12161C; --ink:#E7EAF0; --muted:#9BA4B4; --line:#2A313C;
  --accent:#E57C95; --accent-ink:#1A0B10; --accent-soft:#3A1E27;
  --t-fg:#A3C4F3; --t-bg:#1A2A41; --a-fg:#86D6C4; --a-bg:#13302A; --o-fg:#EDC678; --o-bg:#372B12;
  --ok:#62C98E; --ok-bg:#16301F; --bad:#F28A80; --bad-bg:#3B1A18; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
.backup textarea{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;direction:ltr}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
#app{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--law);font-weight:900;font-size:1.25rem;letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.brand small{display:block;font-family:var(--ui);font-weight:600;font-size:.78rem;color:var(--muted);letter-spacing:0}
.sync{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 9px;white-space:nowrap}
.sync.cloud{color:var(--ok);border-color:currentColor}
main{padding-top:16px}
.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
h2{font-family:var(--law);font-weight:700;font-size:1.45rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
h3{font-size:.8rem;font-weight:800;letter-spacing:.04em;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
a.btn{text-decoration:none;color:inherit}
.btn.pdf svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
/* countdown */
.count{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.count .big{grid-row:span 2;font-family:var(--law);font-weight:900;font-size:3.3rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .l1{font-weight:800;font-size:1.05rem}
.count .l2{color:var(--muted);font-size:.9rem}
.today{display:flex;flex-direction:column;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.82rem;font-weight:700;border-radius:99px;padding:4px 11px;background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lawprog{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.lawprog .nm{font-weight:700;font-size:.95rem;min-width:0}
.lawprog .pc{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);font-size:.9rem}
.lawprog .bar{grid-column:1/-1;margin-bottom:8px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:.95rem}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:.85rem}
/* learn */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.9rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.search{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px}
.lawname{font-family:var(--law);font-weight:700;font-size:1.05rem;margin:14px 0 2px}
.scope{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.hd{font-family:var(--law);font-weight:700;color:var(--accent);font-size:1rem;margin:20px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.hd .sm{display:block;font-family:var(--ui);color:var(--muted);font-weight:700;font-size:.82rem}
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:56px 1fr 12px;gap:10px;align-items:center;padding:11px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:right;width:100%}
.srow .n{font-family:var(--law);font-weight:900;font-size:1.05rem;font-variant-numeric:tabular-nums}
.srow .t{font-weight:600;min-width:0}
.srow .snip{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px;font-family:var(--law)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.s1{background:var(--o-fg)} .dot.s2{background:var(--ok)}
.ref{color:var(--muted);font-weight:400;font-size:.85em}
/* reader */
.rhead{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.crumb{font-size:.82rem;color:var(--muted);font-weight:600}
.secno{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.secno .n{font-family:var(--law);font-weight:900;font-size:2rem;color:var(--accent);line-height:1}
.secno .t{font-family:var(--law);font-weight:700;font-size:1.25rem}
.lawtext{font-family:var(--law);font-size:1.08rem;line-height:1.8}
.lawtext .p{margin:0 0 .5rem;padding-inline-start:calc(var(--v,0) * 1.15rem);white-space:pre-line;overflow-wrap:anywhere}
.lb{font-weight:700;color:var(--muted);margin-inline-end:.4em;white-space:nowrap}
mark{color:inherit;background:none}
.hl mark.t{background:var(--t-bg);color:var(--t-fg);border-radius:4px;padding:0 2px}
.hl mark.a{background:var(--a-bg);color:var(--a-fg);border-radius:4px;padding:0 2px}
.hl mark.o{background:var(--o-bg);color:var(--o-fg);border-radius:4px;padding:0 2px}
mark.ans{background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:4px;padding:0 3px}
mark.alt{background:var(--bad-bg);color:var(--bad);font-weight:700;border-radius:4px;padding:0 3px;text-decoration:line-through}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem}
.legend span{border-radius:6px;padding:1px 8px;font-weight:700}
.legend .t{background:var(--t-bg);color:var(--t-fg)} .legend .a{background:var(--a-bg);color:var(--a-fg)} .legend .o{background:var(--o-bg);color:var(--o-fg)}
.toggle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.partial{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.9rem}
.navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1}
.qtop .k{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);font-size:.9rem}
.qhead{font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.qhead b{color:var(--ink)}
.qbody{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.qbody .ctx{color:var(--muted)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2.5px solid var(--accent);margin:0 2px;color:transparent}
.flag{font-size:.78rem;font-weight:800;color:var(--o-fg);background:var(--o-bg);border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:8px}
.ask{font-weight:800;margin:16px 0 10px;font-size:1.02rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:right;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.02rem;line-height:1.55}
.opt.lawtext{font-size:1.04rem;line-height:1.65}
.opt .tag{display:block;font-family:var(--ui);font-weight:800;font-size:.8rem;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:inherit}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{text-align:center;font-weight:800}
.fb{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.verdict{font-weight:800;font-size:1.05rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.src{border-inline-start:3px solid var(--accent);padding-inline-start:12px}
.src .cap{font-family:var(--ui);font-size:.8rem;font-weight:800;color:var(--muted);margin-bottom:4px}
.fc{min-height:240px;display:flex;flex-direction:column;gap:10px}
.fc .front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:200px}
.fc .front .n{font-family:var(--law);font-weight:900;font-size:2.6rem;color:var(--accent);line-height:1}
.fc .front .t{font-family:var(--law);font-weight:700;font-size:1.3rem;text-wrap:balance}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{padding:8px 6px;font-size:.92rem;flex-direction:column;gap:0}
.rate .btn small{font-weight:600;color:var(--muted);font-size:.72rem}
.rate .again{border-color:var(--bad);color:var(--bad)} .rate .good{border-color:var(--ok);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem}
.field select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:8px 12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-height:104px}
.mode b{font-size:1rem}
.mode span{color:var(--muted);font-size:.84rem;line-height:1.4}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cnt{display:flex;gap:8px}
.cnt button{flex:1;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.cnt button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.score{font-family:var(--law);font-weight:900;font-size:4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.qnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.qnav button{flex:none;width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.qnav button.done{background:var(--sunk)}
.qnav button.cur{border-color:var(--accent);color:var(--accent)}
.qnav button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.qnav button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.low{color:var(--bad)}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.weak{display:flex;flex-direction:column}
.weak button{display:flex;justify-content:space-between;gap:10px;text-align:right;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px}
.weak .pc{color:var(--bad);font-weight:800;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.confirm{background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
details.rev{border-bottom:1px solid var(--line);padding:10px 0}
details.rev summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:baseline}
details.rev summary .m{font-weight:900}
details.rev summary .m.ok{color:var(--ok)} details.rev summary .m.bad{color:var(--bad)}
details.rev .in{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.small{font-size:.85rem;color:var(--muted)}
@media (min-width:560px){.modes{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.mode{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <h1 class="brand">שינון סדר דין פלילי<small id="hdr-sub">נוסח החוק בלבד · מבחן 7.2.2027</small></h1>
    <span class="sync" id="sync">נשמר במכשיר</span>
  </header>
  <main id="view"><p class="empty">טוען את נוסח החוקים…</p></main>
</div>
<nav class="tabs" dir="rtl" aria-label="ניווט ראשי">
  <div class="tabs-in">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>היום</button>
    <button class="tab" data-tab="learn"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6M9 11h6"/></svg>נוסח החוק</button>
    <button class="tab" data-tab="practice"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>תרגול</button>
    <button class="tab" data-tab="exam"><svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M7 5H5v16h14V5h-2"/><path d="M8 13l2.5 2.5L16 10"/></svg>מבחן</button>
  </div>
</nav>

<script>
(function(){
'use strict';
document.documentElement.lang='he';document.documentElement.dir='rtl';
const view=document.getElementById('view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a.slice()).slice(0,n);
const dayNum=d=>Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const EXAM_DAY=dayNum(new Date(2027,1,7));
const today=()=>dayNum(new Date());
const INT=[0,1,2,4,7,14];
const REVIEW_BUFFER=10;

/* ---------- progress state ---------- */
const LS='sdp-progress-v1';
const blank=()=>({v:1,u:0,it:{},rd:{},ex:[],dl:{}});
let S=blank();
try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);if(o&&o.v===1)S=Object.assign(blank(),o)}}catch(e){}
let prefs={hl:true,law:'cpl'};
try{Object.assign(prefs,JSON.parse(localStorage.getItem('sdp-prefs')||'{}'))}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('sdp-prefs',JSON.stringify(prefs))}catch(e){}};
let ref=null,writing=false,dirty=false,pushTimer=null;
function save(){S.u=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(ref){clearTimeout(pushTimer);pushTimer=setTimeout(push,2500)}}
async function push(){if(!ref)return;if(writing){dirty=true;return}writing=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));setSync('cloud')}catch(e){setSync('local')}
  writing=false;if(dirty){dirty=false;push()}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&ref){clearTimeout(pushTimer);push()}});
function setSync(m){const el=document.getElementById('sync');if(!el)return;

/* ---------- data ---------- */
let D=null;const SEC={},LAW={},ITEMS={},LISTS=[];
const POOL={time:{},allW:[],D:new Set(),I:new Set()};
const DEAD=/^\((?:נמחקה|נמחק|בוטלה|בוטל|פקע|פקעה)\)$/;
function init(data){
  D=data;
  D.laws.forEach(l=>{LAW[l.id]=l;l.sections=[]});
  D.sections.forEach((s,si)=>{
    SEC[s.id]=s;s.L=LAW[s.law];s.L.sections.push(s);s.k=s.L.sections.length-1;
    s.paras.forEach((p,i)=>{p.i=i;let j=i-1;while(j>=0&&s.paras[j].v>=p.v)j--;p.par=j;});
    addItem('c|'+s.id,{t:'c',s});
    if(s.paras.some(p=>p.t.length>=40))addItem('i|'+s.id,{t:'i',s});
    s.paras.forEach((p,pi)=>{
      (p.f||[]).forEach((f,fi)=>{
        const a=p.t.slice(f[0],f[1]);
        if(f[2]==='t'){const k=f[3]+'|'+f[5];(POOL.time[k]=POOL.time[k]||new Map()).set(a,f[4]);if(f[5]==='w')POOL.allW.push([a,f[4],f[3]])}
        if(f[2]==='a')POOL[f[3]].add(a);
        if(f[2]==='a'&&f[4]===1)return;
        addItem('z|'+s.id+'|'+pi+'|'+fi,{t:'z',s,p,f});
      });
      const kids=s.paras.filter(q=>q.par===pi&&q.l.length&&!DEAD.test(q.t.trim()));
      if(kids.length>=3&&kids.every(k=>k.t.length<=260)){addItem('l|'+s.id+'|'+pi,{t:'l',s,p,kids});LISTS.push({s,p,kids})}
    });
  });
  initSync();
  route();
}
function addItem(k,o){o.key=k;ITEMS[k]=o;(o.s.items=o.s.items||[]).push(k)}
fetch('data.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(init).catch(()=>{view.innerHTML='<p class="empty">לא הצלחתי לטעון את נוסח החוקים. רענן את הדף.</p>'});

/* ---------- SRS ---------- */
const st=k=>S.it[k];
function grade(k,q){// q: 0 again, 1 hard, 2 good
  const t=today();const o=S.it[k]||[0,t,0,0,t];
  let box=o[0];
  if(q===2)box=Math.min(5,box+1);else if(q===1)box=Math.max(1,box);else box=0;
  let due=t+(q===1?1:INT[box]);
  if(t<EXAM_DAY-1)due=Math.min(due,EXAM_DAY-1);
  S.it[k]=[box,due,o[2]+(q===2?1:0),o[3]+(q===0?1:0),t];
  save();
}
function secScore(s){let sum=0,n=0;(s.items||[]).forEach(k=>{const o=S.it[k];sum+=o?Math.min(o[0],4)/4:0;n++});return n?sum/n:0}
function secState(s){const c=S.it['c|'+s.id];const sc=secScore(s);if(!c&&sc===0)return 0;return sc>=.6?2:1}
function lawScore(l){return l.sections.reduce((a,s)=>a+secScore(s),0)/l.sections.length}
const isNewSec=s=>!S.it['c|'+s.id];
function planInfo(){
  const t=today();const left=Math.max(0,EXAM_DAY-t);
  const unseen=D.sections.filter(isNewSec);
  const learnedToday=S.dl[t]||0;
  const days=Math.max(1,left-REVIEW_BUFFER);
  const perDay=Math.ceil((unseen.length+learnedToday)/days);
  const newToday=Math.max(0,Math.min(unseen.length,perDay-learnedToday));
  const due=Object.keys(ITEMS).filter(k=>{const o=S.it[k];return o&&o[1]<=t});
  return {left,unseen,perDay,newToday,due,learnedToday};
}

// The trailing [..] in a margin title points to the section number in the pre-consolidation law; it is not exam material, so it is not shown.
const titleHTML=t=>{const m=String(t).match(/^(.*?)(\s*\[[^\]]*\])$/);return m?esc(m[1]):esc(t)};
const lbHTML=p=>p.l.map(l=>'<span class="lb">('+esc(l)+')</span>').join('');
function textWithMarks(t,marks){// marks: [{s,e,cls,rep}]
  marks=marks.slice().sort((a,b)=>a.s-b.s);let out='',pos=0;
  for(const m of marks){if(m.s<pos)continue;out+=esc(t.slice(pos,m.s));
    if(m.blank)out+='<span class="blank" aria-label="מקום ריק">'+'&nbsp;'.repeat(8)+'</span>';
    else out+='<mark class="'+m.cls+'">'+esc(m.rep!=null?m.rep:t.slice(m.s,m.e))+'</mark>';pos=m.e}
  return out+esc(t.slice(pos));
}
function factMarks(p){return (p.f||[]).map(f=>({s:f[0],e:f[1],cls:f[2]}))}
function paraHTML(p,o={}){
  let marks=o.marks||[];let t=p.t;let pre='',post='';
  if(o.window&&marks.length&&t.length>420){
    const s0=Math.min(...marks.map(m=>m.s)),e0=Math.max(...marks.map(m=>m.e));
    let a=Math.max(0,s0-190),b=Math.min(t.length,e0+190);
    if(a>0){const sp=t.indexOf(' ',a);a=sp>=0&&sp<s0?sp+1:a;pre='… '}
    if(b<t.length){const sp=t.lastIndexOf(' ',b);b=sp>e0?sp:b;post=' …'}
    marks=marks.map(m=>({...m,s:m.s-a,e:m.e-a}));t=t.slice(a,b);
  }
  return '<div class="p'+(o.cls?' '+o.cls:'')+'" style="--v:'+(o.flat?0:p.v)+'">'+(o.nolb?'':lbHTML(p))+pre+textWithMarks(t,marks)+post+'</div>';
}
function ctxParas(s,p){
  const chain=[];let j=p.par;
  while(j>=0&&chain.length<2){chain.unshift(s.paras[j]);j=s.paras[j].par}
  if(!chain.length&&p.i>0&&!s.paras[0].l.length&&/[–:]$/.test(s.paras[0].t.trim()))chain.push(s.paras[0]);
  return chain;
}
function ctxHTML(s,p){return ctxParas(s,p).map(q=>paraHTML(q,{cls:'ctx',window:false,marks:[]})).join('')}
const secLabel=s=>'סעיף '+esc(s.num)+(s.partial?' <span class="ref">('+esc(s.partial)+' בלבד)</span>':'');
const headLine=(s,hideSec)=>'<b>'+esc(s.L.short)+'</b>'+(hideSec?'':' · '+secLabel(s)+' · '+titleHTML(s.title));
function headingOf(s){return s.L.headings[s.h]}
const fmtHeading=h=>h?String(h).replace(/:/,' · '):'';

/* ---------- distractors ---------- */
const norm=x=>x.replace(/[יו]/g,'');
function distract(f,ans,n=3){
  if(f[2]==='o')return shuffle(['פשע','עוון','חטא'].filter(x=>x!==ans)).slice(0,n);
  if(f[2]==='a'){const na=norm(ans);
    const pool=[...POOL[f[3]]].filter(x=>{const nx=norm(x);return x!==ans&&!nx.includes(na)&&!na.includes(nx)});
    return sample(pool,n)}
  const u=f[3],val=f[4],form=f[5];
  const byVal=new Map();
  for(const [t,v] of (POOL.time[u+'|'+form]||new Map()))if(v!==val&&t!==ans&&!byVal.has(v))byVal.set(v,t);
  let c=[...byVal.entries()].sort((a,b)=>Math.abs(Math.log(a[0]/val))-Math.abs(Math.log(b[0]/val)));
  let out=sample(c.slice(0,Math.max(n+2,5)),n).map(x=>x[1]);
  if(out.length<n&&form==='d'){const unit=ans.replace(/^[\d,]+\s/,'');
    for(const k of [val*2,Math.round(val/2),val*3,val+Math.max(1,Math.round(val/3)),val+1]){const t=k+' '+unit;
      if(k>0&&k!==val&&out.length<n&&!out.includes(t))out.push(t)}}
  if(out.length<n){const others=shuffle(POOL.allW.filter(([t,v,uu])=>t!==ans&&!(uu===u&&v===val)&&!out.includes(t)));
    for(const [t] of others){if(out.length>=n)break;if(!out.includes(t))out.push(t)}}
  return out;
}
const ASK={t:'השלימו את פרק הזמן החסר',a:'השלימו את הגורם החסר',o:'השלימו את סוג העבירה החסר'};

/* ---------- question builders ---------- */
function qCloze(k){const it=ITEMS[k],{s,p,f}=it;const ans=p.t.slice(f[0],f[1]);
  const opts=shuffle([{x:ans,ok:1},...distract(f,ans).map(x=>({x,ok:0}))]);
  return {key:k,kind:'z',s,head:headLine(s),
    body:ctxHTML(s,p)+paraHTML(p,{marks:[{s:f[0],e:f[1],blank:1}],window:true}),
    ask:ASK[f[2]],opts:opts.map(o=>({h:esc(o.x),ok:!!o.ok,law:1})),
    explain:()=>srcBox(s,ctxHTML(s,p)+paraHTML(p,{marks:[{s:f[0],e:f[1],cls:'ans'}]}))};
}
function qTF(k){const it=ITEMS[k],{s,p,f}=it;const ans=p.t.slice(f[0],f[1]);
  const alt=distract(f,ans,1)[0];const truth=!alt||Math.random()<.5;const shown=truth?ans:alt;
  return {key:k,kind:'tf',s,head:headLine(s),
    body:'<span class="flag">היגד לבדיקה · ייתכן ששונה מלשון החוק</span>'+ctxHTML(s,p)+paraHTML(p,{marks:[{s:f[0],e:f[1],cls:'',rep:shown}],window:true}),
    ask:'האם ההיגד תואם במדויק את לשון החוק?',tf:1,
    opts:[{h:'נכון',ok:truth},{h:'לא נכון',ok:!truth}],
    explain:()=>(truth?'':'<p>בהיגד הופיע <mark class="alt">'+esc(alt)+'</mark> במקום <mark class="ans">'+esc(ans)+'</mark>.</p>')+srcBox(s,ctxHTML(s,p)+paraHTML(p,{marks:[{s:f[0],e:f[1],cls:'ans'}]}))};
}
function qList(k){const it=ITEMS[k],{s,p,kids}=it;
  const shown=sample(kids,3);const texts=new Set(kids.map(q=>q.t.trim()));
  const avg=shown.reduce((a,q)=>a+q.t.length,0)/3;
  let cands=[];LISTS.forEach(L=>{if(L.p===p)return;if(L.s.law!==s.law)return;L.kids.forEach(q=>{if(!texts.has(q.t.trim())&&!DEAD.test(q.t.trim()))cands.push({L,q})})});
  const close=cands.filter(c=>c.q.t.length>avg*.45&&c.q.t.length<avg*2.2);
  const fo=pick(close.length?close:cands);
  const opts=shuffle([...shown.map(q=>({q,ok:0})),{q:fo.q,ok:1,from:fo.L.s}]);
  return {key:k,kind:'l',s,head:headLine(s),
    body:ctxHTML(s,p)+paraHTML(p,{marks:[]}),
    ask:'איזה מהבאים אינו מנוי בסעיף זה?',
    opts:opts.map(o=>({h:esc(o.q.t),ok:!!o.ok,law:1})),
    explain:()=>'<p>הפריט שאינו מנוי לקוח מ'+esc(fo.L.s.L.short)+', סעיף '+esc(fo.L.s.num)+'.</p>'+srcBox(s,ctxHTML(s,p)+paraHTML(p,{marks:[]})+kids.map(q=>paraHTML(q,{marks:[]})).join(''))};
}
function qIdent(k){const s=ITEMS[k].s;
  let c=s.paras.filter(p=>p.t.length>=40&&p.t.length<=340&&!DEAD.test(p.t.trim()));
  if(!c.length)c=s.paras.filter(p=>p.t.length>=40);
  const p=pick(c);
  const others=s.L.sections.filter(x=>x!==s&&x.title.replace(/\s*\[.*\]$/,'')!==s.title.replace(/\s*\[.*\]$/,''));
  const near=others.filter(x=>x.h===s.h),far=others.filter(x=>x.h!==s.h&&Math.abs(x.k-s.k)<25);
  let ds=sample(near,2);ds=ds.concat(sample(far.filter(x=>!ds.includes(x)),3-ds.length));
  if(ds.length<3)ds=ds.concat(sample(others.filter(x=>!ds.includes(x)),3-ds.length));
  const opts=shuffle([{x:s,ok:1},...ds.map(x=>({x,ok:0}))]);
  return {key:k,kind:'i',s,head:headLine(s,true),
    body:paraHTML(p,{marks:[],window:false}),
    ask:'לאיזה סעיף שייך הנוסח?',
    opts:opts.map(o=>({h:'<span class="tag">סעיף '+esc(o.x.num)+'</span>'+titleHTML(o.x.title),ok:!!o.ok})),
    explain:()=>srcBox(s,paraHTML(p,{marks:[]}))};
}
function qStmt(k){// four statements, one exact
  const it=ITEMS[k];const s=it.s;
  const ok=p=>p.f&&p.t.length<=260&&p.f.some(f=>!(f[2]==='a'&&f[4]===1));
  let pool=[];const add=(sec)=>sec.paras.forEach(p=>{if(ok(p)&&!pool.some(x=>x.p===p))pool.push({s:sec,p})});
  const base={s,p:it.p};
  add(s);s.L.sections.filter(x=>x.h===s.h&&x!==s).forEach(add);
  if(pool.length<4)s.L.sections.filter(x=>Math.abs(x.k-s.k)<12).forEach(add);
  pool=pool.filter(x=>x.p!==it.p);
  const others=sample(pool,3);if(others.length<3||!ok(it.p))return qCloze(k);
  const alt=others.map(o=>{const fs=o.p.f.filter(f=>!(f[2]==='a'&&f[4]===1));const f=pick(fs);const ans=o.p.t.slice(f[0],f[1]);const r=distract(f,ans,1)[0];return {...o,f,ans,r}}).filter(o=>o.r);
  if(alt.length<3)return qCloze(k);
  const opts=shuffle([{o:base,ok:1},...alt.map(o=>({o,ok:0}))]);
  return {key:k,kind:'st',s,head:'<b>'+esc(s.L.short)+'</b> · '+esc(fmtHeading(headingOf(s).sm||headingOf(s).ch)),
    body:'<span class="flag">שלושה מההיגדים שונו</span><div>איזה מההיגדים הבאים תואם במדויק את לשון החוק?</div>',
    ask:'',
    opts:opts.map(x=>{const o=x.o;const h=x.ok?esc(o.p.t):textWithMarks(o.p.t,[{s:o.f[0],e:o.f[1],cls:'',rep:o.r}]);
      return {h:'<span class="tag">'+'סעיף '+esc(o.s.num)+'</span>'+h,ok:!!x.ok,law:1}}),
    explain:()=>alt.map(o=>'<div class="small">סעיף '+esc(o.s.num)+': בהיגד <mark class="alt">'+esc(o.r)+'</mark>, בחוק <mark class="ans">'+esc(o.ans)+'</mark></div>').join('')+srcBox(s,paraHTML(it.p,{marks:[]}))};
}
function srcBox(s,inner){return '<div class="src lawtext"><div class="cap">'+esc(s.L.short)+' · '+secLabel(s)+' · '+titleHTML(s.title)+'</div>'+inner+'</div><button class="linkish" data-open="'+esc(s.id)+'">לסעיף המלא</button>'}
function buildQ(k,kindHint){const t=ITEMS[k].t;
  if(t==='z'){if(kindHint==='tf')return qTF(k);if(kindHint==='st')return qStmt(k);return qCloze(k)}
  if(t==='l')return qList(k);if(t==='i')return qIdent(k);return {key:k,kind:'c',s:ITEMS[k].s};
}

/* ---------- selection ---------- */
function scopeSecs(sc){return D.sections.filter(s=>(sc.law==='all'||s.law===sc.law)&&(sc.h==null||sc.h===''||String(s.h)===String(sc.h)))}
function priority(k){const o=S.it[k],t=today();if(!o)return 1.2+Math.random();if(o[1]<=t)return o[0]*.15+Math.random()*.5;return 2+o[0]+Math.random()}
function chooseKeys(secs,types,n,weak){
  let ks=[];secs.forEach(s=>(s.items||[]).forEach(k=>{if(types.includes(ITEMS[k].t))ks.push(k)}));
  if(weak)ks=ks.filter(k=>{const o=S.it[k];return o&&(o[0]<3||o[3]>0)});
  ks.sort((a,b)=>priority(a)-priority(b));
  // spread: avoid too many from one section
  const out=[],per={};for(const k of ks){const s=ITEMS[k].s.id;if((per[s]||0)>=2&&ks.length>n*2)continue;per[s]=(per[s]||0)+1;out.push(k);if(out.length>=n)break}
  return shuffle(out);
}

function startExam(mins){
  const all=Object.keys(ITEMS);
  const byT=t=>all.filter(k=>ITEMS[k].t===t);
  const zt=byT('z').filter(k=>ITEMS[k].f[2]==='t'),za=byT('z').filter(k=>ITEMS[k].f[2]==='a');
  const plan=[...sample(zt,6).map(k=>[k,'z']),...sample(za,3).map(k=>[k,'z']),...sample(byT('z'),5).map(k=>[k,'st']),...sample(byT('l'),5).map(k=>[k,null]),...sample(byT('i'),6).map(k=>[k,null])];
  const qs=[];const used=new Set();
  for(const [k,kind] of shuffle(plan)){if(used.has(k))continue;used.add(k);const q=buildQ(k,kind);if(q.opts&&q.opts.length>=3)qs.push(q)}
  exam={qs:qs.slice(0,25),ans:{},i:0,end:mins?Date.now()+mins*6e4:0,done:false,confirm:false};
  clearInterval(exTimer);if(mins)exTimer=setInterval(tick,1000);
  render();window.scrollTo(0,0);
}

  if(el){const m=Math.floor(left/6e4),s=Math.floor(left%6e4/1e3);el.textContent=m+':'+String(s).padStart(2,'0');el.classList.toggle('low',left<5*6e4)}}

  <div class="qnav">${exam.qs.map((_,j)=>`<button data-j="${j}" class="${j===exam.i?'cur':''} ${exam.ans[j]!=null?'done':''}" aria-label="שאלה ${j+1}">${j+1}</button>`).join('')}</div>
  <div class="qhead">${q.head}</div>
  <div class="qbody lawtext">${q.body}</div>
  ${q.ask?`<p class="ask">${q.ask}</p>`:'<div style="height:12px"></div>'}
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${o.law?'lawtext':''} ${a===i?'sel':''}" data-i="${i}">${o.h}</button>`).join('')}</div>
  <div class="navrow"><button class="btn" id="ep" ${exam.i?'':'disabled'}>→ הקודמת</button><button class="btn" id="en" ${exam.i<n-1?'':'disabled'}>הבאה ←</button></div>
  <div style="margin-top:12px">${exam.confirm?`<div class="confirm"><b>להגיש את המבחן?</b><span class="small">ענית על ${Object.keys(exam.ans).length} מתוך ${n} שאלות.</span><div class="navrow" style="margin:0"><button class="btn primary" id="es2">הגש</button><button class="btn" id="ec">המשך לענות</button></div></div>`:`<button class="btn primary block" id="es">הגשת המבחן</button>`}</div>
  <p style="margin-top:14px"><button class="linkish" id="eq">ביטול המבחן</button></p>`;
  tick();
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{exam.ans[exam.i]=+b.dataset.i;renderExamQ()});
  view.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{exam.i=+b.dataset.j;renderExamQ();window.scrollTo(0,0)});
  document.getElementById('ep').onclick=()=>{exam.i--;renderExamQ();window.scrollTo(0,0)};
  document.getElementById('en').onclick=()=>{exam.i++;renderExamQ();window.scrollTo(0,0)};
  const es=document.getElementById('es');if(es)es.onclick=()=>{exam.confirm=true;renderExamQ()};
  const es2=document.getElementById('es2');if(es2)es2.onclick=submitExam;
  const ec=document.getElementById('ec');if(ec)ec.onclick=()=>{exam.confirm=false;renderExamQ()};
  document.getElementById('eq').onclick=()=>{clearInterval(exTimer);exam=null;render()};
  const cur=view.querySelector('.qnav .cur');if(cur)cur.scrollIntoView({block:'nearest',inline:'center'});
}
function submitExam(){
  clearInterval(exTimer);let pts=0;
  exam.qs.forEach((q,i)=>{const a=exam.ans[i];const ok=a!=null&&q.opts[a].ok;if(ok)pts+=4;grade(q.key,ok?2:0)});
  exam.score=pts;exam.done=true;S.ex.push({d:today(),s:pts});if(S.ex.length>30)S.ex=S.ex.slice(-30);save();
  render();window.scrollTo(0,0);
}
function renderExamResult(){
  const n=exam.qs.length;
  view.innerHTML=`<div class="stack">
    <h2>תוצאת המבחן</h2>
    <div class="panel row" style="gap:18px"><span class="score">${exam.score}</span><span>${exam.score/4} מתוך ${n} תשובות נכונות</span></div>
    <div class="panel"><h3 style="margin-top:0">פירוט התשובות</h3>
    ${exam.qs.map((q,i)=>{const a=exam.ans[i];const ok=a!=null&&q.opts[a].ok;const right=q.opts.find(o=>o.ok);
      return `<details class="rev"><summary><span class="m ${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><span>שאלה ${i+1} · ${esc(q.s.L.short)} · סעיף ${esc(q.s.num)}</span></summary><div class="in">
        <div class="qbody lawtext">${q.body}</div>
        ${a!=null&&!ok?`<div class="opt bad lawtext">${q.opts[a].h}</div>`:''}${a==null?'<div class="small">לא נענתה</div>':''}
        <div class="opt ok lawtext">${right.h}</div>${q.explain()}</div></details>`}).join('')}
    </div>
    <button class="btn primary block" id="ex-new">מבחן חדש</button></div>`;
  document.getElementById('ex-new').onclick=()=>{exam=null;render()};
}
})();
</script>
</body>
</html>
